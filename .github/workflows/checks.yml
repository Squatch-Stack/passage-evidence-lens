name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax and catalog
        run: |
          python -m py_compile dev_server.py tests/security.py tests/e2e.py tests/profile.py
          node --check app.js
          python -m json.tool data/loci.json > /dev/null
      - name: Install browser test runtime
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Public mode security and browser checks
        run: |
          python dev_server.py --port 8777 > /tmp/lens-preview.log 2>&1 &
          curl --fail --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8777/ > /dev/null
          python tests/security.py --skip-local
          python tests/e2e.py --skip-local
