name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Syntax and catalog
        run: |
          python -m py_compile dev_server.py tests/security.py tests/e2e.py tests/profile.py
          node --check app.js
          python -m json.tool data/loci.json > /dev/null
      - name: Install browser test runtime
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Public mode security and browser checks
        run: |
          python dev_server.py --port 8777 > /tmp/lens-preview.log 2>&1 &
          curl --fail --silent --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8777/ > /dev/null
          python tests/security.py --skip-local
          python tests/e2e.py --skip-local
